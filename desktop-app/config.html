<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MyEstoque - Configuracao</title>
    <style>
      /* Tela para informar/alterar o endereco do servidor do sistema */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 32px;
      }
      .cartao {
        max-width: 520px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 32px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; color: #f8fafc; }
      p { margin: 0 0 20px; line-height: 1.55; color: #cbd5e1; }
      label { display: block; font-weight: 600; margin-bottom: 8px; color: #f1f5f9; }
      input {
        width: 100%;
        font: inherit;
        font-family: Consolas, monospace;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #5eead4;
        margin-bottom: 6px;
      }
      input:focus { outline: 2px solid #0d9488; outline-offset: 1px; }
      .dica { font-size: 13px; color: #94a3b8; margin-bottom: 22px; }
      .acoes { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        font: inherit;
        font-weight: 600;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .principal { background: #0d9488; color: #fff; }
      .principal:hover { background: #0f766e; }
      .secundario { background: transparent; color: #e2e8f0; border-color: #475569; }
      .secundario:hover { background: #334155; }
      .erro { color: #fca5a5; margin-top: 14px; min-height: 20px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="cartao">
      <h1>Endereco do servidor</h1>
      <p>
        Informe o endereco do computador que hospeda o MyEstoque. No proprio
        computador do Almoxarifado use <strong>localhost:5173</strong>; nos PDVs,
        use o IP da maquina do Almoxarifado na rede local.
      </p>
      <label for="servidor">Endereco</label>
      <input id="servidor" type="text" placeholder="192.168.1.207:5173" autocomplete="off" spellcheck="false" />
      <div class="dica">Pode digitar so o IP e a porta — o "http://" e adicionado automaticamente.</div>
      <div class="acoes">
        <button class="principal" id="salvar">Salvar e conectar</button>
        <button class="secundario" id="cancelar">Cancelar</button>
      </div>
      <div class="erro" id="erro"></div>
    </div>

    <script>
      const campo = document.querySelector("#servidor");
      const erro = document.querySelector("#erro");

      // Pre-preenche com o endereco atualmente configurado
      const parametros = new URLSearchParams(location.search);
      campo.value = parametros.get("atual") || "";
      campo.focus();
      campo.select();

      async function salvar() {
        erro.textContent = "";
        const resultado = await window.myestoque.salvarEndereco(campo.value);
        if (!resultado.ok) erro.textContent = resultado.erro;
      }

      document.querySelector("#salvar").addEventListener("click", salvar);
      campo.addEventListener("keydown", (evento) => {
        if (evento.key === "Enter") salvar();
      });
      // Cancelar volta a tentar o endereco que ja estava salvo
      document.querySelector("#cancelar").addEventListener("click", () => window.myestoque.tentarNovamente());
    </script>
  </body>
</html>
